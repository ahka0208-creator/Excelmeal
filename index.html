<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>營地分枱紙自動生成器（Excel 膳食表直出 PDF 版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 標楷體 / DFKai-SB Kai font stack */
    .font-kai {
      font-family: 'DFKai-SB', '標楷體', 'BiauKai', 'Kaiti TC', 'STKaiti', 'KaiTi', serif;
    }
    
    /* Custom Scrollbar for App UI */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Print Specific CSS */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printContainer, #printContainer * {
        visibility: visible !important;
      }
      #printContainer {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .a4-page {
        page-break-after: always !important;
        break-after: page !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }

    /* Border style classes for cards */
    .card-border-solid {
      border: 1px solid #000000;
    }
    .card-border-dashed {
      border: 1px dashed #000000;
    }
    .card-border-none {
      border: 1px solid transparent;
    }

    /* Collapsed border layout for 2x2 grid */
    .grid-collapsed {
      display: grid;
      border-collapse: collapse;
    }

    /* Card styling */
    .table-card {
      color: #000000;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      text-align: center;
      background: #ffffff;
      overflow: hidden;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Header Navigation -->
  <header class="bg-slate-900 text-white px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-md shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">📋</span>
      <div>
        <h1 class="text-lg font-bold leading-tight">營地分枱紙自動生成器</h1>
        <p class="text-xs text-slate-400">Excel 膳食表直出 PDF / Word 專用工具 (香港傳統營地版)</p>
      </div>
    </div>
    
    <!-- Action Controls -->
    <div class="flex items-center flex-wrap gap-2">
      <button onclick="loadDemoData()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs font-medium rounded transition flex items-center gap-1">
        <span>🔄</span> 載入示範數據
      </button>
      <button onclick="exportWordDoc()" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-600 text-white text-xs font-medium rounded transition flex items-center gap-1 shadow-sm">
        <span>📄</span> 匯出 Word (.doc)
      </button>
      <button onclick="downloadHtmlFile()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-medium rounded transition flex items-center gap-1 shadow-sm">
        <span>⬇️</span> 下載列印檔 (.html)
      </button>
      <button onclick="triggerPrint()" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded transition flex items-center gap-1 shadow-md">
        <span>🖨️</span> 列印 / 儲存 PDF
      </button>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- Left Sidebar: Excel Upload & Sheet Selector & Group Controls -->
    <aside id="sidebar" class="w-full md:w-[320px] lg:w-[360px] bg-white border-r border-slate-200 flex flex-col shrink-0 overflow-y-auto z-10 transition-all duration-300">
      
      <!-- Upload Drop Zone Panel -->
      <div class="p-4 border-b border-slate-200 bg-slate-50">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1">
          <span>1. 上傳膳食表 Excel</span>
        </h2>
        
        <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-amber-500 bg-white rounded-lg p-4 text-center cursor-pointer transition-colors duration-150">
          <input type="file" id="excelFileInput" accept=".xlsx" class="hidden" onchange="handleFileUpload(event)">
          <label for="excelFileInput" class="cursor-pointer flex flex-col items-center">
            <svg class="w-8 h-8 text-amber-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <span class="text-sm font-semibold text-slate-700">點擊上傳或拖放 .xlsx 檔案</span>
            <span class="text-xs text-slate-400 mt-1">支援大檔案 (如 膳食表 - 電子版.xlsx)</span>
          </label>
        </div>

        <!-- Live Status Box -->
        <div id="excelStatusBox" class="mt-3 p-2.5 rounded-md text-xs bg-slate-100 text-slate-600 border border-slate-200 font-mono leading-relaxed">
          💡 請上傳 .xlsx 膳食表開始產生分枱紙。
        </div>
      </div>

      <!-- Sheet Selector Section (Hidden by default, shown after file upload) -->

        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
            <span>2. 選擇工作表 (週表)</span>
          </h2>

            <input type="checkbox" id="showAllSheetsToggle" onchange="filterSheetsList()" class="rounded text-amber-600"> 顯示全部
          </label>
        </div>

        <!-- Filter Pills & Search -->
        <div class="space-y-2 mb-3">
          <div id="yearPills" class="flex flex-wrap gap-1"></div>
          <input type="text" id="sheetSearchInput" oninput="filterSheetsList()" placeholder="搜尋工作表 (例: 11W4)..." class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-amber-500">
        </div>

        <!-- Action buttons for sheets -->
        <div class="flex items-center justify-between text-xs mb-2">
          <span id="sheetCountBadge" class="text-slate-400 font-mono">0 個工作表</span>
          <div class="space-x-2">
            <button onclick="selectAllSheets(true)" class="text-amber-600 hover:underline">全選</button>
            <button onclick="selectAllSheets(false)" class="text-slate-500 hover:underline">取消全選</button>
          </div>
        </div>

        <!-- Sheet List Container -->
        <div id="sheetListContainer" class="max-h-40 overflow-y-auto border border-slate-200 rounded bg-white p-2 space-y-1 text-xs"></div>
      </div>

      <!-- Group Selection & Management -->
      <div id="groupSection" class="p-4 flex-1 overflow-y-auto">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">3. 團體名單與膳食</h2>
          <div class="space-x-2 text-xs">
            <button onclick="selectAllGroups(true)" class="text-amber-600 hover:underline">全選</button>
            <button onclick="selectAllGroups(false)" class="text-slate-500 hover:underline">取消全選</button>
          </div>
        </div>

        <!-- Toggles & Search -->
        <div class="space-y-2 mb-3">
          <label class="text-xs text-slate-600 flex items-center gap-1.5 cursor-pointer bg-slate-100 p-2 rounded">
            <input type="checkbox" id="cleanTagsToggle" checked onchange="reprocessParsedData()" class="rounded text-amber-600">
            <span>自動清除 (pencil)/(pan) 標記</span>
          </label>
          <input type="text" id="groupSearchInput" oninput="renderGroupList()" placeholder="搜尋團體名稱..." class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-amber-500">
        </div>

        <!-- Group List Checklist -->
        <div id="groupListContainer" class="space-y-1.5 text-xs"></div>
      </div>

    <!-- Main Workspace (A4 Canvas & Controls Toolbar) -->
    <main class="flex-1 bg-slate-200/80 flex flex-col overflow-hidden relative">

      <!-- Formatting Toolbar -->
      <div class="bg-white border-b border-slate-300 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-sm z-10">
        <!-- Layout Selection -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 text-xs text-slate-600 font-medium">
            <span>每頁張數：</span>
            <select id="gridSelect" onchange="updateGridOption(this.value)" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50 focus:outline-none focus:ring-1 focus:ring-amber-500 font-bold">
              <option value="2x2" selected>2 × 2 (每頁 4 張 - 標準大字)</option>
              <option value="2x3">2 × 3 (每頁 6 張 - 中型)</option>
              <option value="2x4">2 × 4 (每頁 8 張 - 精簡)</option>
            </select>
          </div>

          <div class="flex items-center gap-1 text-xs text-slate-600 font-medium">
            <span>框線樣式：</span>
            <select id="borderSelect" onchange="updateBorderOption(this.value)" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50 focus:outline-none">
              <option value="card-border-solid" selected>實線 (Solid)</option>
              <option value="card-border-dashed">虛線 (Dashed)</option>
              <option value="card-border-none">無框線 (None)</option>
            </select>
          </div>
        </div>

        <!-- Font Size Sliders -->
        <div class="flex items-center gap-4 flex-wrap">
          <div class="flex items-center gap-1.5 text-xs text-slate-700">
            <span class="font-bold">標題大細:</span>
            <button onclick="adjustFontSize('titlePt', -1)" class="w-5 h-5 bg-slate-200 hover:bg-slate-300 rounded font-bold text-center leading-none">-</button>
            <span id="titlePtVal" class="font-mono w-8 text-center font-bold">25pt</span>
            <button onclick="adjustFontSize('titlePt', 1)" class="w-5 h-5 bg-slate-200 hover:bg-slate-300 rounded font-bold text-center leading-none">+</button>
          </div>

          <div class="flex items-center gap-1.5 text-xs text-slate-700">
            <span class="font-bold">內文大細:</span>
            <button onclick="adjustFontSize('bodyPt', -1)" class="w-5 h-5 bg-slate-200 hover:bg-slate-300 rounded font-bold text-center leading-none">-</button>
            <span id="bodyPtVal" class="font-mono w-8 text-center font-bold">20pt</span>
            <button onclick="adjustFontSize('bodyPt', 1)" class="w-5 h-5 bg-slate-200 hover:bg-slate-300 rounded font-bold text-center leading-none">+</button>
          </div>

          <button onclick="resetFontSizes()" class="text-xs text-slate-500 hover:text-amber-600 underline">重設字體</button>
        </div>
      </div>

      <!-- Preview Zoom Scaler Outer Window -->
      <div id="previewViewport" class="flex-1 overflow-auto p-4 md:p-8 flex justify-center items-start">
        
        <!-- Scaled A4 Render Area -->
        <div id="a4ScaleWrapper" class="transition-transform origin-top">
          <div id="printContainer" class="flex flex-col gap-8">
            <!-- Dynamic A4 Pages will be inserted here -->
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Custom Print Fallback Modal (Triggered if window.print is blocked by iframe sandbox) -->
  <div id="printModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 text-slate-800">
      <div class="flex items-center justify-between border-b pb-3 mb-4">
        <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <span>🖨️</span> 列印與 PDF 匯出選項
        </h3>
        <button onclick="closePrintModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <p class="text-xs text-slate-600 mb-4 leading-relaxed">
        由於此頁面可能嵌入於 Google Sites (iframe)，原生日誌列印可能被瀏覽器權限阻擋。請選擇以下方式進行列印：
      </p>

      <div class="space-y-3">
        <button onclick="printViaBlobWindow()" class="w-full text-left p-3 rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 transition flex items-start gap-3">
          <span class="text-2xl">🌐</span>
          <div>
            <div class="font-bold text-sm text-amber-900">方案 A：在新視窗開啟獨立列印頁</div>
            <div class="text-xs text-amber-700">自動彈出瀏覽器列印對話框，可直接存為 PDF</div>
          </div>
        </button>

        <button onclick="downloadHtmlFile()" class="w-full text-left p-3 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 transition flex items-start gap-3">
          <span class="text-2xl">⬇️</span>
          <div>
            <div class="font-bold text-sm text-slate-800">方案 B：下載獨立 HTML 列印檔</div>
            <div class="text-xs text-slate-500">雙擊下載檔案即可以在 Chrome / Edge 開啟並 100% 精準列印</div>
          </div>
        </button>

        <button onclick="exportWordDoc()" class="w-full text-left p-3 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 transition flex items-start gap-3">
          <span class="text-2xl">📄</span>
          <div>
            <div class="font-bold text-sm text-slate-800">方案 C：匯出 Word (.doc) 檔</div>
            <div class="text-xs text-slate-500">適合需手工修飾、調整版面後再列印</div>
          </div>
        </button>
      </div>

      <div class="mt-5 text-right">
        <button onclick="closePrintModal()" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded">關閉</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ==========================================================================
       CRITICAL FIX #1 — Zero-Dependency Native .xlsx ZIP & XML Parser
       ========================================================================== */
    
    // Safely inflate raw deflate stream without deadlocking pipe streams
    async function inflateRaw(compressedBytes) {
      if (typeof DecompressionStream !== 'function') {
        throw new Error('瀏覽器版本過舊，不支援原生解壓（DecompressionStream），請升級 Chrome / Edge / Safari');
      }
      const stream = new Blob([compressedBytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      const ab = await new Response(stream).arrayBuffer();
      return new Uint8Array(ab);
    }

    // Native ZIP Index Parser reading correct Local Header Offsets
    function parseZipIndex(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      if (bytes.length >= 4 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) {
        throw new Error('此檔案為舊版 .xls 格式，請先用 Excel「另存新檔」轉為 .xlsx 格式再上傳。');
      }
      if (bytes.length < 22 || bytes[0] !== 0x50 || bytes[1] !== 0x4B) {
        throw new Error('檔案不是有效的 .xlsx（ZIP）格式，請確認檔案未損毀或未加密。');
      }
      const dv = new DataView(arrayBuffer);
      let eocdPos = -1;
      const minPos = Math.max(0, bytes.length - 65557);
      for (let i = bytes.length - 22; i >= minPos; i--) {
        if (bytes[i] === 0x50 && bytes[i+1] === 0x4B && bytes[i+2] === 0x05 && bytes[i+3] === 0x06) {
          eocdPos = i;
          break;
        }
      }
      if (eocdPos === -1) throw new Error('找不到 ZIP 目錄結尾（EOCD），檔案可能不完整。');
      
      const totalEntries = dv.getUint16(eocdPos + 10, true);
      const cdOffset = dv.getUint32(eocdPos + 16, true);
      const decoder = new TextDecoder('utf-8');
      const entries = new Map();
      let p = cdOffset;
      for (let idx = 0; idx < totalEntries; idx++) {
        if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014b50) break;
        const method = dv.getUint16(p + 10, true);
        const compSize = dv.getUint32(p + 20, true);
        const nameLen = dv.getUint16(p + 28, true);
        const extraLen = dv.getUint16(p + 30, true);
        const commentLen = dv.getUint16(p + 32, true);
        const localHeaderOffset = dv.getUint32(p + 42, true);
        const name = decoder.decode(bytes.subarray(p + 46, p + 46 + nameLen));
        entries.set(name, { method, compSize, localHeaderOffset });
        p += 46 + nameLen + extraLen + commentLen;
      }

      async function readText(path) {
        const entry = entries.get(path) || entries.get(path.replace(/^\/+/, ''));
        if (!entry) return null;
        const lhoff = entry.localHeaderOffset;
        if (dv.getUint32(lhoff, true) !== 0x04034b50) {
          throw new Error('讀取檔案標頭失敗：' + path);
        }
        const lNameLen = dv.getUint16(lhoff + 26, true);
        const lExtraLen = dv.getUint16(lhoff + 28, true);
        const start = lhoff + 30 + lNameLen + lExtraLen;
        const raw = bytes.subarray(start, start + entry.compSize);
        let outBytes;
        if (entry.method === 0) outBytes = raw;
        else if (entry.method === 8) outBytes = await inflateRaw(raw);
        else throw new Error('不支援的 ZIP 壓縮方式：' + entry.method);
        return decoder.decode(outBytes);
      }

      return { entries, readText };
    }

    /* ==========================================================================
       GLOBAL STATE & EXCEL WORKBOOK ENGINE
       ========================================================================== */

    let zipEngine = null;
    let sharedStrings = [];
    let is1904DateSystem = false;
    let workbookSheets = []; // Array of { name, targetPath, sheetId }
    let parsedSheetCache = new Map(); // path -> raw extracted group rows
    let activeSheetNames = new Set();
    let aggregatedGroups = []; // Array of processed group objects
    let selectedYearFilter = 'ALL';

    // Formatting options
    let currentConfig = {
      grid: '2x2', // '2x2', '2x3', '2x4'
      borderClass: 'card-border-solid',
      titlePt: 25,
      bodyPt: 20
    };

    // Global Error Listeners to guarantee Zero-Silence Feedback
    window.addEventListener('error', function (e) {
      updateStatus(`❌ 系統發生錯誤：${e.message}`, 'error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      updateStatus(`❌ 非同步運算錯誤：${e.reason ? (e.reason.message || e.reason) : e}`, 'error');
    });

    // Helper to log status to UI
    function updateStatus(msg, type = 'info') {
      const box = document.getElementById('excelStatusBox');
      if (!box) return;
      box.textContent = msg;
      box.className = 'mt-3 p-2.5 rounded-md text-xs font-mono leading-relaxed ';
      if (type === 'error') {
        box.className += 'bg-red-50 text-red-700 border border-red-200 font-bold';
      } else if (type === 'success') {
        box.className += 'bg-emerald-50 text-emerald-800 border border-emerald-200 font-semibold';
      } else {
        box.className += 'bg-slate-100 text-slate-700 border border-slate-200';
      }
    }

    /* Setup Drag & Drop Handlers */
    window.addEventListener('DOMContentLoaded', () => {
      const dropZone = document.getElementById('dropZone');
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add('border-amber-500', 'bg-amber-50/50');
        }, false);
      });
      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove('border-amber-500', 'bg-amber-50/50');
        }, false);
      });
      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
          document.getElementById('excelFileInput').files = files;
          handleFileUpload({ target: { files: files } });
        }
      });

      // Observe canvas container resizing to auto scale A4
      const viewport = document.getElementById('previewViewport');
      const resizeObserver = new ResizeObserver(() => fitA4Scale());
      resizeObserver.observe(viewport);

      // Load initial demo data for immediate visual confirmation
      loadDemoData();
    });

    /* Handle File Upload Process */
    async function handleFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        updateStatus(`⏳ 正在讀取檔案「${file.name}」...`);
        const arrayBuffer = await file.arrayBuffer();

        updateStatus(`⏳ 正在讀取工作表目錄...`);
        zipEngine = parseZipIndex(arrayBuffer);

        // Parse workbook.xml
        const wbXmlStr = await zipEngine.readText('xl/workbook.xml');
        if (!wbXmlStr) throw new Error('無法找到 xl/workbook.xml');
        const domParser = new DOMParser();
        const wbDoc = domParser.parseFromString(wbXmlStr, 'application/xml');

        // Check 1904 date system
        const wbPr = wbDoc.getElementsByTagName('workbookPr')[0] || wbDoc.getElementsByTagNameNS('*', 'workbookPr')[0];
        is1904DateSystem = wbPr ? (wbPr.getAttribute('date1904') === '1' || wbPr.getAttribute('date1904') === 'true') : false;

        // Parse workbook rels to map rId -> sheet target path
        const wbRelsStr = await zipEngine.readText('xl/_rels/workbook.xml.rels');
        const relsMap = new Map();
        if (wbRelsStr) {
          const relsDoc = domParser.parseFromString(wbRelsStr, 'application/xml');
          const relEls = relsDoc.getElementsByTagNameNS('*', 'Relationship');
          for (let i = 0; i < relEls.length; i++) {
            const rel = relEls[i];
            const id = rel.getAttribute('Id');
            let target = rel.getAttribute('Target');
            if (target) {
              target = target.replace(/^\/+/, '');
              if (!target.startsWith('xl/')) target = 'xl/' + target;
              relsMap.set(id, target);
            }
          }
        }

        // Extract Sheet names
        const sheetEls = wbDoc.getElementsByTagNameNS('*', 'sheet');
        workbookSheets = [];
        for (let i = 0; i < sheetEls.length; i++) {
          const s = sheetEls[i];
          const name = s.getAttribute('name');
          let rId = '';
          for (let a = 0; a < s.attributes.length; a++) {
            const attr = s.attributes[a];
            if (attr.localName === 'id' || attr.name === 'r:id' || attr.name.endsWith(':id')) {
              rId = attr.value;
              break;
            }
          }
          const targetPath = relsMap.get(rId) || `xl/worksheets/sheet${i + 1}.xml`;
          workbookSheets.push({ name, targetPath, sheetId: s.getAttribute('sheetId') });
        }

        // Parse sharedStrings.xml if present
        updateStatus(`⏳ 正在載入共享字串庫 (SharedStrings)...`);
        sharedStrings = [];
        const ssXmlStr = await zipEngine.readText('xl/sharedStrings.xml');
        if (ssXmlStr) {
          const ssDoc = domParser.parseFromString(ssXmlStr, 'application/xml');
          const siEls = ssDoc.getElementsByTagNameNS('*', 'si');
          for (let i = 0; i < siEls.length; i++) {
            const si = siEls[i];
            let text = '';
            // Get all descendant <t> elements excluding phonetic runs <rPh>
            const tEls = si.getElementsByTagNameNS('*', 't');
            for (let j = 0; j < tEls.length; j++) {
              const tNode = tEls[j];
              if (tNode.parentNode && tNode.parentNode.localName === 'rPh') continue;
              text += tNode.textContent || '';
            }
            sharedStrings.push(text);
          }
        }

        // Clear cache
        parsedSheetCache.clear();
        activeSheetNames.clear();

        updateStatus(`✅ 已載入「${file.name}」（共 ${workbookSheets.length} 張工作表），請在下方勾選週表！`, 'success');

        // Reveal Sheet Section and Render List
        document.getElementById('sheetSection').classList.remove('hidden');
        buildSheetSelectorUI();

        // Auto-select week sheet closest to current week or first 2026 weekly sheet
        autoSelectDefaultSheet();

      } catch (err) {
        console.error(err);
        updateStatus(`❌ 解析失敗：${err.message}`, 'error');
      } finally {
        document.getElementById('excelFileInput').value = '';
      }
    }

    /* ==========================================================================
       SHEET SELECTOR & YEAR FILTER LOGIC
       ========================================================================== */

    function isWeeklySheet(name) {
      const skipKeywords = ['MENU', '防疫餐單', '菜式分量', '菜式份量', '空白表', '工作表1', 'Sheet1', '範本'];
      for (let kw of skipKeywords) {
        if (name.toUpperCase().includes(kw.toUpperCase())) return false;
      }
      return true;
    }

    function buildSheetSelectorUI() {
      const yearSet = new Set();
      workbookSheets.forEach(s => {
        const match = s.name.match(/\b(20\d\d)\b/);
        if (match) yearSet.add(match[1]);
      });

      const yearPills = document.getElementById('yearPills');
      yearPills.innerHTML = '';

      const createPill = (label, yearVal) => {
        const btn = document.createElement('button');
        btn.className = `px-2 py-0.5 rounded text-xs font-semibold border transition ${selectedYearFilter === yearVal ? 'bg-amber-500 text-white border-amber-500' : 'bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200'}`;
        btn.textContent = label;
        btn.onclick = () => {
          selectedYearFilter = yearVal;
          buildSheetSelectorUI();
          filterSheetsList();
        };
        return btn;
      };

      yearPills.appendChild(createPill('全部週表', 'ALL'));
      Array.from(yearSet).sort().forEach(yr => {
        yearPills.appendChild(createPill(`${yr}年`, yr));
      });

      filterSheetsList();
    }

    function filterSheetsList() {
      const showAll = document.getElementById('showAllSheetsToggle').checked;
      const search = document.getElementById('sheetSearchInput').value.trim().toLowerCase();
      const container = document.getElementById('sheetListContainer');
      container.innerHTML = '';

      let count = 0;
      workbookSheets.forEach((s) => {
        // Filter by Weekly rules unless showAll
        if (!showAll && !isWeeklySheet(s.name)) return;

        // Filter by Year
        if (selectedYearFilter !== 'ALL' && !s.name.includes(selectedYearFilter)) return;

        // Filter by Search
        if (search && !s.name.toLowerCase().includes(search)) return;

        count++;
        const isChecked = activeSheetNames.has(s.name);
        const item = document.createElement('label');
        item.className = 'flex items-center gap-2 p-1 hover:bg-slate-100 rounded cursor-pointer select-none';
        item.innerHTML = `
          <input type="checkbox" class="sheet-checkbox text-amber-600 rounded" value="${escapeHtml(s.name)}" ${isChecked ? 'checked' : ''} onchange="toggleSheetSelection('${escapeJsStr(s.name)}', this.checked)">
          <span class="${isChecked ? 'font-bold text-amber-900' : 'text-slate-700'}">${escapeHtml(s.name)}</span>
        `;
        container.appendChild(item);
      });

      document.getElementById('sheetCountBadge').textContent = `${count} 個工作表`;
    }

    function selectAllSheets(check) {
      const checkboxes = document.querySelectorAll('.sheet-checkbox');
      checkboxes.forEach(cb => {
        cb.checked = check;
        if (check) activeSheetNames.add(cb.value);
        else activeSheetNames.delete(cb.value);
      });
      processSelectedSheets();
    }

    function toggleSheetSelection(sheetName, checked) {
      if (checked) activeSheetNames.add(sheetName);
      else activeSheetNames.delete(sheetName);
      processSelectedSheets();
    }

    function autoSelectDefaultSheet() {
      // Find 2026 weekly sheets or first weekly sheet
      let target = workbookSheets.find(s => s.name.includes('2026') && isWeeklySheet(s.name));
      if (!target) target = workbookSheets.find(s => isWeeklySheet(s.name));
      if (!target && workbookSheets.length > 0) target = workbookSheets[0];

      if (target) {
        activeSheetNames.add(target.name);
        filterSheetsList();
        processSelectedSheets();
      }
    }

    /* ==========================================================================
       LAZY SHEET PARSING & MEAL DATA EXTRACTION
       ========================================================================== */

    async function processSelectedSheets() {
      if (activeSheetNames.size === 0) {
        aggregatedGroups = [];
        renderGroupList();
        renderPrintCards();
        return;
      }

      updateStatus(`⏳ 正在解析已選定的 ${activeSheetNames.size} 個週表...`);

      const allExtractedRows = [];
      for (let name of activeSheetNames) {
        let parsedRows = parsedSheetCache.get(name);
        if (!parsedRows) {
          const sheetInfo = workbookSheets.find(s => s.name === name);
          if (sheetInfo) {
            parsedRows = await parseWorksheetData(sheetInfo.targetPath);
            parsedSheetCache.set(name, parsedRows);
          }
        }
        if (parsedRows) {
          allExtractedRows.push(...parsedRows);
        }
      }

      // Aggregate and process groups
      aggregateGroupMeals(allExtractedRows);
      updateStatus(`✅ 成功載入膳食數據（已合併 ${aggregatedGroups.length} 個團體資料）`, 'success');
      renderGroupList();
      renderPrintCards();
    }

    // Convert Excel column letters like C, H, N to 1-based index (A=1, B=2, C=3, H=8, N=14...)
    function colToIdx(colStr) {
      let idx = 0;
      for (let i = 0; i < colStr.length; i++) {
        idx = idx * 26 + (colStr.charCodeAt(i) - 64);
      }
      return idx;
    }

    // Helper: Excel Serial Date to JS Date
    function excelSerialToDate(serial) {
      const num = parseFloat(serial);
      if (isNaN(num) || num <= 0) return null;
      const baseEpoch = is1904DateSystem ? new Date(1904, 0, 1) : new Date(1899, 11, 30);
      const days = Math.floor(num);
      const millis = Math.round((num - days) * 86400 * 1000);
      const targetDate = new Date(baseEpoch.getTime() + days * 86400000 + millis);
      return targetDate;
    }

    function formatDateDM(date) {
      if (!date || isNaN(date.getTime())) return '';
      return `${date.getDate()}/${date.getMonth() + 1}`;
    }

    // Parse single XML Worksheet (Lazy loading, skipping rows > 35)
    async function parseWorksheetData(targetPath) {
      const xmlStr = await zipEngine.readText(targetPath);
      if (!xmlStr) return [];

      const domParser = new DOMParser();
      const sheetDoc = domParser.parseFromString(xmlStr, 'application/xml');
      const rowEls = sheetDoc.getElementsByTagNameNS('*', 'row');

      // Map rows by row number
      const rowsMap = new Map();
      for (let i = 0; i < rowEls.length; i++) {
        const row = rowEls[i];
        const rNum = parseInt(row.getAttribute('r'), 10);
        if (rNum > 35) continue; // Skip unnecessary bottom rows

        const cellsMap = new Map();
        const cEls = row.getElementsByTagNameNS('*', 'c');
        for (let j = 0; j < cEls.length; j++) {
          const c = cEls[j];
          const ref = c.getAttribute('r'); // e.g. C8
          const colStr = ref.replace(/[0-9]/g, '');
          const colIdx = colToIdx(colStr);
          const t = c.getAttribute('t');
          const vEl = c.getElementsByTagNameNS('*', 'v')[0];
          let val = vEl ? vEl.textContent.trim() : '';

          if (t === 's' && val !== '') {
            const idx = parseInt(val, 10);
            val = sharedStrings[idx] !== undefined ? sharedStrings[idx] : val;
          } else if (t === 'inlineStr') {
            const isEl = c.getElementsByTagNameNS('*', 'is')[0];
            val = isEl ? isEl.textContent.trim() : '';
          }
          cellsMap.set(colIdx, val);
        }
        rowsMap.set(rNum, cellsMap);
      }

      // Step 1: Detect Start Date from Row 1 D1 (col 4)
      let startDateSerial = null;
      const row1 = rowsMap.get(1);
      if (row1 && row1.has(4)) {
        const d1Val = row1.get(4);
        if (!isNaN(parseFloat(d1Val)) && parseFloat(d1Val) > 35000) {
          startDateSerial = parseFloat(d1Val);
        }
      }

      // Step 2: Detect Dates from Row 8 across columns: H(8), N(14), T(20), Z(26), AF(32), AL(38), AR(44)
      const dateColIndices = [8, 14, 20, 26, 32, 38, 44];
      const dayDates = []; // Array of 7 JS Date strings (D/M)

      const row8 = rowsMap.get(8);
      for (let dIdx = 0; dIdx < 7; dIdx++) {
        const cIdx = dateColIndices[dIdx];
        let dVal = row8 ? row8.get(cIdx) : null;
        let dateObj = null;

        if (dVal && !isNaN(parseFloat(dVal)) && parseFloat(dVal) > 35000) {
          dateObj = excelSerialToDate(parseFloat(dVal));
        } else if (startDateSerial) {
          dateObj = excelSerialToDate(startDateSerial + dIdx);
        }

        dayDates.push(dateObj ? formatDateDM(dateObj) : `Day${dIdx+1}`);
      }

      // Step 3: Scan Group Rows 11 to 32
      const extractedRows = [];
      for (let r = 11; r <= 32; r++) {
        const row = rowsMap.get(r);
        if (!row) continue;

        const groupNameRaw = row.get(3); // Col C (3)
        if (!groupNameRaw || groupNameRaw.trim() === '') continue;

        // Stop if hit total count header
        if (groupNameRaw.includes('每餐總枱數') || groupNameRaw.includes('總枱數')) break;

        const mealEntries = [];
        // Loop 7 days
        for (let dIdx = 0; dIdx < 7; dIdx++) {
          const baseCol = dateColIndices[dIdx];
          const dateStr = dayDates[dIdx];

          const bVal = row.get(baseCol);     // 早 (Breakfast)
          const lVal = row.get(baseCol + 2); // 午 (Lunch)
          const dVal = row.get(baseCol + 4); // 晚 (Dinner)

          mealEntries.push({ dateStr, dayIndex: dIdx, bVal, lVal, dVal });
        }

        extractedRows.push({
          rawName: groupNameRaw.trim(),
          meals: mealEntries
        });
      }

      return extractedRows;
    }

    /* Clean Tag Regex: strip pencil, pan, mark, pending, tentative inside parens while preserving (A), (B), etc. */
    function cleanGroupName(name) {
      if (!name) return '';
      let cleaned = name;
      const cleanRegex = /\s*[\(（]\s*(?:pencil|pencal|pan|mark|pending|tentative|\s|[\/\+\,])+\s*[\)）]/gi;
      cleaned = cleaned.replace(cleanRegex, '');
      return cleaned.trim();
    }

    /* Aggregate Group Data & Parse Meal Cells */
    function aggregateGroupMeals(rawRows) {
      const doCleanTags = document.getElementById('cleanTagsToggle').checked;
      const groupMap = new Map();

      rawRows.forEach(item => {
        const displayName = doCleanTags ? cleanGroupName(item.rawName) : item.rawName.trim();
        
        // Detect Cancelled / HOLD status
        const isCancelled = /取消|HOLD|CX|不訂膳|未訂膳/i.test(item.rawName);

        if (!groupMap.has(displayName)) {
          groupMap.set(displayName, {
            id: 'grp_' + Math.random().toString(36).substring(2, 9),
            name: displayName,
            originalName: item.rawName,
            isCancelled: isCancelled,
            selected: !isCancelled, // unchecked by default if cancelled
            daysMap: new Map() // dateStr -> { b: [], l: [], d: [], bbq: [] }
          });
        }

        const groupObj = groupMap.get(displayName);

        item.meals.forEach(m => {
          if (!groupObj.daysMap.has(m.dateStr)) {
            groupObj.daysMap.set(m.dateStr, { dateStr: m.dateStr, b: [], l: [], d: [], bbq: [] });
          }
          const dayData = groupObj.daysMap.get(m.dateStr);

          parseMealCell(m.bVal, '早', dayData);
          parseMealCell(m.lVal, '午', dayData);
          parseMealCell(m.dVal, '晚', dayData);
        });
      });

      aggregatedGroups = Array.from(groupMap.values());
    }

    function reprocessParsedData() {
      processSelectedSheets();
    }

    /* Cell Content Parser for BBQ, Western, Veg, Tables */
    function parseMealCell(cellVal, mealType, dayData) {
      if (!cellVal) return;
      const str = String(cellVal).trim();
      if (!str || str === '0' || str === 'X' || str === 'x' || str.includes('2組原烹') || str.includes('人數有變')) return;

      const isBBQ = /BBQ/i.test(str);
      const isWestern = /西/i.test(str);

      // Check Vegetarian table split
      let vegTables = 0;
      if (/半枱素|半枱西素|0\.5素/i.test(str)) vegTables = 0.5;
      else if (/1枱素|1枱西素/i.test(str)) vegTables = 1.0;

      // Extract numbers
      if (isBBQ) {
        let tables = 0;
        const tableMatch = str.match(/([0-9\.]+)\s*(?:枱|份)/);
        if (tableMatch) {
          tables = parseFloat(tableMatch[1]);
        } else {
          const numMatch = str.match(/([0-9\.]+)/);
          if (numMatch) {
            const rawNum = parseFloat(numMatch[1]);
            tables = Math.ceil((rawNum / 8) * 2) / 2;
          }
        }
        if (tables > 0) {
          dayData.bbq.push({ tables, isWestern, mealType });
        }
        return;
      }

      // Normal Meals
      let mainTables = 0;
      const numMatch = str.match(/([0-9\.]+)/);
      if (numMatch) {
        mainTables = parseFloat(numMatch[1]);
      }

      if (vegTables > 0 && mainTables >= vegTables) {
        mainTables = mainTables - vegTables;
        // Add veg entry to day
        dayData[mealTypeKey(mealType)].push({ tables: vegTables, isWestern, isVeg: true });
      }

      if (mainTables > 0) {
        dayData[mealTypeKey(mealType)].push({ tables: mainTables, isWestern, isVeg: false });
      }
    }

    function mealTypeKey(type) {
      if (type === '早') return 'b';
      if (type === '午') return 'l';
      return 'd';
    }

    /* ==========================================================================
       CARD GENERATION & SAME-DAY PHRASE MERGING
       ========================================================================== */

    function generateCardsForGroup(group) {
      if (!group.selected) return [];

      // Collect dates in order
      const dateList = Array.from(group.daysMap.values());
      if (dateList.length === 0) return [];

      // Calculate Maximum Tables across all meals for this group to detect half-table splitting
      let maxTables = 0;
      let hasVeg = false;

      const groupNormalSchedule = []; // { dateStr, lines: [] }
      const groupVegSchedule = [];

      dateList.forEach(d => {
        const dateStr = d.dateStr;
        
        // Process Normal Meals for this date
        const normalLines = formatSameDayMeals(d.b, d.l, d.d, d.bbq, false);
        if (normalLines.lines.length > 0) {
          groupNormalSchedule.push({ dateStr, lines: normalLines.lines });
          if (normalLines.maxT > maxTables) maxTables = normalLines.maxT;
        }

        // Process Veg Meals for this date
        const vegLines = formatSameDayMeals(d.b, d.l, d.d, d.bbq, true);
        if (vegLines.lines.length > 0) {
          hasVeg = true;
          groupVegSchedule.push({ dateStr, lines: vegLines.lines });
        }
      });

      const cards = [];

      // Check if maxTables ends with .5 (e.g. 2.5, 5.5, 0.5)
      const hasHalfTable = (maxTables % 1 !== 0);
      const fullCount = Math.floor(maxTables);

      // 1. Generate Normal Cards
      if (maxTables > 0) {
        if (hasHalfTable) {
          // Generate fullCount full cards
          for (let i = 0; i < fullCount; i++) {
            cards.push({
              title: group.name,
              isHalf: false,
              subtitle: '',
              schedule: groupNormalSchedule,
              footer: '（限最多 8 人一枱）'
            });
          }
          // Generate 1 Half-Table Card
          cards.push({
            title: group.name,
            isHalf: true,
            subtitle: '',
            schedule: groupNormalSchedule,
            footer: '（限最多 4 人一枱）'
          });
        } else {
          // All full cards
          const count = fullCount > 0 ? fullCount : 1;
          for (let i = 0; i < count; i++) {
            cards.push({
              title: group.name,
              isHalf: false,
              subtitle: '',
              schedule: groupNormalSchedule,
              footer: '（限最多 8 人一枱）'
            });
          }
        }
      }

      // 2. Generate Vegetarian Cards if present
      if (hasVeg) {
        cards.push({
          title: `${group.name} (素)`,
          isHalf: false,
          subtitle: 'Vegetables',
          schedule: groupVegSchedule,
          footer: '（限最多 8 人一枱）'
        });
      }

      return cards;
    }

    /* Format Same Day Meals into HK Natural Phrasing */
    function formatSameDayMeals(bList, lList, dList, bbqList, vegOnly) {
      const lines = [];
      let maxT = 0;

      const getTables = (list) => {
        const filtered = list.filter(x => x.isVeg === vegOnly);
        if (filtered.length === 0) return 0;
        return filtered[0].tables;
      };

      const bT = getTables(bList);
      const lT = getTables(lList);
      const dT = getTables(dList);

      [bT, lT, dT].forEach(t => { if (t > maxT) maxT = t; });

      // Grouping logic for b, l, d sharing same table counts
      if (bT > 0 && bT === lT && lT === dT) {
        lines.push(`早、午、晚餐 ${bT} 枱`);
      } else if (bT > 0 && bT === lT && dT === 0) {
        lines.push(`早、午餐 ${bT} 枱`);
      } else if (bT > 0 && bT === dT && lT === 0) {
        lines.push(`早、晚餐 ${bT} 枱`);
      } else if (lT > 0 && lT === dT && bT === 0) {
        lines.push(`午、晚餐 ${lT} 枱`);
      } else {
        if (bT > 0) lines.push(`早餐 ${bT} 枱`);
        if (lT > 0) lines.push(`午餐 ${lT} 枱`);
        if (dT > 0) lines.push(`晚餐 ${dT} 枱`);
      }

      // BBQ lines
      if (!vegOnly && bbqList && bbqList.length > 0) {
        bbqList.forEach(item => {
          lines.push(`BBQ ${item.tables} 枱`);
          if (item.tables > maxT) maxT = item.tables;
        });
      }

      return { lines, maxT };
    }

    /* ==========================================================================
       DOM RENDERING: GROUP CHECKLIST & A4 CARDS
       ========================================================================== */

    function renderGroupList() {
      const container = document.getElementById('groupListContainer');
      const search = document.getElementById('groupSearchInput').value.trim().toLowerCase();
      container.innerHTML = '';

      if (aggregatedGroups.length === 0) {
        container.innerHTML = `<div class="text-slate-400 text-xs text-center py-4">無團體資料</div>`;
        return;
      }

      aggregatedGroups.forEach(grp => {
        if (search && !grp.name.toLowerCase().includes(search)) return;

        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-2 rounded border text-xs transition ${grp.isCancelled ? 'bg-red-50 border-red-200' : 'bg-white border-slate-200 hover:bg-slate-50'}`;

        item.innerHTML = `
          <label class="flex items-center gap-2 flex-1 cursor-pointer select-none">
            <input type="checkbox" class="rounded text-amber-600" ${grp.selected ? 'checked' : ''} onchange="toggleGroupSelection('${grp.id}', this.checked)">
            <span class="font-medium ${grp.isCancelled ? 'text-red-700 line-through' : 'text-slate-800'}">${escapeHtml(grp.name)}</span>
          </label>
          ${grp.isCancelled ? '<span class="px-1.5 py-0.5 bg-red-100 text-red-800 rounded text-[10px] font-bold">已取消/HOLD</span>' : ''}
        `;
        container.appendChild(item);
      });
    }

    function toggleGroupSelection(id, checked) {
      const grp = aggregatedGroups.find(g => g.id === id);
      if (grp) {
        grp.selected = checked;
        renderPrintCards();
      }
    }

    function selectAllGroups(check) {
      aggregatedGroups.forEach(g => { g.selected = check; });
      renderGroupList();
      renderPrintCards();
    }

    /* Render A4 Pages Grid */
    function renderPrintCards() {
      const container = document.getElementById('printContainer');
      container.innerHTML = '';

      // Collect all cards for all selected groups
      let allCards = [];
      aggregatedGroups.forEach(grp => {
        const cards = generateCardsForGroup(grp);
        allCards.push(...cards);
      });

      if (allCards.length === 0) {
        container.innerHTML = `
          <div class="a4-page bg-white shadow-xl rounded p-12 text-center text-slate-400 flex flex-col items-center justify-center font-sans" style="width:210mm; height:297mm;">
            <span class="text-5xl mb-4">📭</span>
            <p class="text-base font-bold text-slate-600">暫無已勾選的團體分枱卡</p>
            <p class="text-xs text-slate-400 mt-1">請在上傳 Excel 後，於左側勾選團體即可自動預覽生成！</p>
          </div>
        `;
        fitA4Scale();
        return;
      }

      // Determine Cards per page based on grid layout
      let cardsPerPage = 4;
      let gridCols = 2;
      let gridRows = 2;
      let cardHeight = '140mm';

      if (currentConfig.grid === '2x3') {
        cardsPerPage = 6;
        gridRows = 3;
        cardHeight = '92mm';
      } else if (currentConfig.grid === '2x4') {
        cardsPerPage = 8;
        gridRows = 4;
        cardHeight = '68mm';
      }

      // Partition cards into pages
      const pages = [];
      for (let i = 0; i < allCards.length; i += cardsPerPage) {
        pages.push(allCards.slice(i, i + cardsPerPage));
      }

      pages.forEach((pageCards, pageIdx) => {
        const pageEl = document.createElement('div');
        pageEl.className = 'a4-page bg-white shadow-xl relative font-kai overflow-hidden';
        pageEl.style.width = '210mm';
        pageEl.style.height = '297mm';
        pageEl.style.padding = '8mm';
        pageEl.style.boxSizing = 'border-box';

        const gridContainer = document.createElement('div');
        gridContainer.className = 'w-full h-full grid grid-cols-2 gap-0 border-collapse';
        gridContainer.style.gridTemplateRows = `repeat(${gridRows}, 1fr)`;

        pageCards.forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.className = `table-card ${currentConfig.borderClass}`;
          cardEl.style.padding = '6mm 5mm';

          // Title pt shrink check if > 11 chars
          let titleSizePt = currentConfig.titlePt;
          if (card.title.length > 11) {
            titleSizePt = Math.max(16, currentConfig.titlePt * 0.82);
          }

          // Build Title Block
          let titleBlockHtml = `<div class="card-title font-kai" style="font-size:${titleSizePt}pt; font-weight:400; line-height:1.25;">${escapeHtml(card.title)}</div>`;
          if (card.isHalf) {
            titleBlockHtml += `<div class="card-half-badge font-kai" style="font-size:${titleSizePt * 1.12}pt; font-weight:400; margin-top:0.12em;">（半圍）</div>`;
          }
          if (card.subtitle) {
            titleBlockHtml += `<div class="card-subtitle font-kai" style="font-size:${titleSizePt * 0.88}pt; font-weight:400;">${escapeHtml(card.subtitle)}</div>`;
          }

          // Build Schedule Block
          let scheduleHtml = `<div class="w-full flex flex-col justify-center gap-3">`;
          card.schedule.forEach(day => {
            scheduleHtml += `
              <div class="day-block">
                <div class="card-date font-kai font-bold" style="font-size:${currentConfig.bodyPt * 1.25}pt; line-height:1.2;">${escapeHtml(day.dateStr)}</div>
                ${day.lines.map(line => `<div class="card-meal font-kai" style="font-size:${currentConfig.bodyPt}pt; line-height:1.3; margin-top:0.1em;">${escapeHtml(line)}</div>`).join('')}
              </div>
            `;
          });
          scheduleHtml += `</div>`;

          // Build Footer Block
          const footerHtml = `<div class="card-footer font-kai" style="font-size:${currentConfig.bodyPt}pt; font-weight:400;">${escapeHtml(card.footer)}</div>`;

          cardEl.innerHTML = titleBlockHtml + scheduleHtml + footerHtml;
          gridContainer.appendChild(cardEl);
        });

        // Fill remaining empty cells in grid if last page
        const remaining = cardsPerPage - pageCards.length;
        for (let r = 0; r < remaining; r++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = `table-card ${currentConfig.borderClass} opacity-0`;
          gridContainer.appendChild(emptyCell);
        }

        pageEl.appendChild(gridContainer);
        container.appendChild(pageEl);
      });

      fitA4Scale();
    }

    /* Auto Scale Preview Viewport to Fit Screen */
    function fitA4Scale() {
      const viewport = document.getElementById('previewViewport');
      const wrapper = document.getElementById('a4ScaleWrapper');
      if (!viewport || !wrapper) return;

      const viewportWidth = viewport.clientWidth - 48; // padding
      const a4WidthPx = 794; // approx px for 210mm @ 96dpi

      if (viewportWidth < a4WidthPx) {
        const scale = Math.max(0.35, viewportWidth / a4WidthPx);
        wrapper.style.transform = `scale(${scale})`;
        wrapper.style.marginBottom = `-${(1 - scale) * 1123}px`;
      } else {
        wrapper.style.transform = 'scale(1)';
        wrapper.style.marginBottom = '0px';
      }
    }

    function adjustFontSize(type, delta) {
      if (type === 'titlePt') {
        currentConfig.titlePt = Math.max(14, Math.min(42, currentConfig.titlePt + delta));
        document.getElementById('titlePtVal').textContent = `${currentConfig.titlePt}pt`;
      } else if (type === 'bodyPt') {
        currentConfig.bodyPt = Math.max(12, Math.min(34, currentConfig.bodyPt + delta));
        document.getElementById('bodyPtVal').textContent = `${currentConfig.bodyPt}pt`;
      }
      renderPrintCards();
    }

    function resetFontSizes() {
      currentConfig.titlePt = 25;
      currentConfig.bodyPt = 20;
      document.getElementById('titlePtVal').textContent = '25pt';
      document.getElementById('bodyPtVal').textContent = '20pt';
      renderPrintCards();
    }

    /* ==========================================================================
       PRINT & EXPORT ENGINES (TRIPLE-LAYER PROTECTION)
       ========================================================================== */

    function triggerPrint() {
      let printTriggered = false;
      const beforePrintHandler = () => { printTriggered = true; };
      window.addEventListener('beforeprint', beforePrintHandler);

      try {
        window.print();
      } catch (e) {
        console.warn('window.print() blocked:', e);
      }

      setTimeout(() => {
        window.removeEventListener('beforeprint', beforePrintHandler);
        if (!printTriggered) {
          // Open fallback modal if print window didn't open
          document.getElementById('printModal').classList.remove('hidden');
        }
      }, 450);
    }

    function closePrintModal() {
      document.getElementById('printModal').classList.add('hidden');
    }

    /* Helper Utilities */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeJsStr(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'");
